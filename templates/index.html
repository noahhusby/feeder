<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Feeder</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='app.css') }}?v=3"
    >
    <script
        src="{{ url_for('static', filename='app.js') }}?v=3"
        defer
    ></script>
</head>

<body>
<main class="page">
    <header class="masthead">
        <h1>Feeder</h1>
        <p>A web-based feedhold controller for a Shapeoko 5.</p>
        <div class="divider" aria-hidden="true"></div>
    </header>

    <section class="camera-section" aria-labelledby="camera-heading">
        <div class="field-heading">
            <h2 id="camera-heading">Camera</h2>
            <span>Video only</span>
        </div>

        <div class="camera-frame">
            <img
                id="camera"
                data-src="{{ url_for('camera_stream') }}"
                alt="Live view of the Shapeoko 5"
            >
        </div>

        <p id="camera-status" class="caption" role="status"></p>
    </section>

    <section class="controls" aria-label="Machine controls">
        <button
            id="feedhold-button"
            class="feedhold-button"
            type="button"
            disabled
        >
            Feedhold
        </button>

        <p
            id="control-status"
            class="status"
            role="status"
            aria-live="polite"
        ></p>

        <noscript>
            <p>JavaScript is required to operate Feedhold.</p>
        </noscript>
    </section>
</main>
</body>
</html>
